name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  api:
    name: API (tsc, migraciones, pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: nymfo_test
          POSTGRES_PASSWORD: nymfo_test
          POSTGRES_DB: nymfo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nymfo_test -d nymfo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nymfo_test:nymfo_test@localhost:5432/nymfo_test?schema=public
      TEST_DATABASE_URL: postgresql://nymfo_test:nymfo_test@localhost:5432/nymfo_test?schema=public
      JWT_ACCESS_SECRET: ci-only-jwt-access-0123456789abcdef-xx
      PASSIMPAY_PLATFORM_ID: "1234"
      PASSIMPAY_API_KEY: ci-passimpay-api-key
      WOMPI_PUBLIC_KEY: pub_test_dummy
      WOMPI_PRIVATE_KEY: prv_test_dummy
      WOMPI_EVENTS_SECRET: ci-wompi-events-key
      WOMPI_INTEGRITY_SECRET: ci-wompi-integrity-key
      PUBLIC_API_URL: http://localhost:4000
      PUBLIC_WEB_URL: http://localhost:3000
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx prisma generate
      - run: npx tsc --noEmit -p .
      - run: npx prisma migrate deploy
      - run: npm test

  web:
    name: Web (tsc, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx next build

  backoffice:
    name: Backoffice (tsc, lint, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/backoffice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/backoffice/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
      - name: Build (raíz)
        run: npx next build
      - name: Build con prefijo /_svc/backoffice
        run: npx next build
        env:
          NEXT_PUBLIC_BASE_PATH: /_svc/backoffice
