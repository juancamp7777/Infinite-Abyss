name: Deploy

# Cada push a main publica las imágenes en GHCR (sha + main). Si el entorno "staging" tiene los secretos
# DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_KNOWN_HOSTS, además despliega ese sha en el VPS.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: Imagen ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        app: [api, web, backoffice]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/infinite-abyss-${{ matrix.app }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/infinite-abyss-${{ matrix.app }}:main
          # Las NEXT_PUBLIC_* se incrustan en el build (variables del repositorio, no secretos).
          build-args: |
            NEXT_PUBLIC_API_URL=/api-proxy
            NEXT_PUBLIC_SOCKET_PATH=/api-proxy/socket.io
            NEXT_PUBLIC_SITE_URL=${{ vars.CASINO_URL }}
            NEXT_PUBLIC_GAME_FRAME_ORIGINS=${{ vars.GAME_FRAME_ORIGINS }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    name: Desplegar en staging
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    env:
      HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: ¿Hay servidor configurado?
        id: cfg
        run: echo "ready=$([ -n "$HOST" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Desplegar el sha por SSH
        if: steps.cfg.outputs.ready == 'true'
        env:
          USER_: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_deploy "$USER_@$HOST" "cd /opt/infinite-abyss && sed -i 's/^IMAGE_TAG=.*/IMAGE_TAG=$SHA/' .env.production && docker compose -f docker-compose.prod.yml --env-file .env.production up -d --pull always --no-build --remove-orphans && docker image prune -f"
      - name: Sin servidor todavía
        if: steps.cfg.outputs.ready != 'true'
        run: echo "Imágenes publicadas; sin DEPLOY_HOST en el entorno staging no se despliega."
