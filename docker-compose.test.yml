# Postgres efímero para pruebas de apps/api (no es para producción; credenciales no secretas).
#   docker compose -f docker-compose.test.yml up -d
# TEST_DATABASE_URL por defecto: postgresql://nymfo_test:nymfo_test@localhost:5433/nymfo_test?schema=public
services:
  postgres-test:
    image: postgres:15-alpine
    container_name: nymfo-db-test
    environment:
      POSTGRES_USER: nymfo_test
      POSTGRES_PASSWORD: nymfo_test
      POSTGRES_DB: nymfo_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nymfo_test -d nymfo_test"]
      interval: 3s
      timeout: 3s
      retries: 20
