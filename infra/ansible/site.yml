# Provisiona y despliega Infinite Abyss en un VPS Ubuntu 22.04/24.04.
#   cp infra/ansible/inventory.example.ini infra/ansible/inventory.ini   # IP y usuario inicial
#   ansible-playbook -i infra/ansible/inventory.ini infra/ansible/site.yml -e env_file=infra/.env.production
# Requiere: acceso SSH con llave a un usuario con sudo. Tras la primera ejecución solo entra `deploy_user` con llave.
- name: Infinite Abyss VPS
  hosts: abyss
  become: true
  vars:
    deploy_user: abyss
    app_dir: /opt/infinite-abyss
    ssh_pubkey: "{{ lookup('file', ssh_pubkey_file | default('~/.ssh/id_ed25519.pub')) }}"
    env_file: ../.env.production
    ghcr_user: "{{ lookup('env', 'GHCR_USER') }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"
  handlers:
    - name: restart ssh
      ansible.builtin.service: { name: ssh, state: restarted }
  tasks:
    - name: Paquetes base y actualizaciones de seguridad automáticas
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg, ufw, fail2ban, unattended-upgrades]
        update_cache: true
        upgrade: safe

    - name: Actualizaciones automáticas activas
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
        mode: "0644"

    - name: Usuario de despliegue con llave SSH
      ansible.builtin.user: { name: "{{ deploy_user }}", shell: /bin/bash, groups: [sudo], append: true }

    - name: Llave autorizada del usuario de despliegue
      ansible.posix.authorized_key: { user: "{{ deploy_user }}", key: "{{ ssh_pubkey }}" }

    - name: SSH solo con llave y sin root
      ansible.builtin.lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?\\s*{{ item.key }}\\s"
        line: "{{ item.key }} {{ item.value }}"
        validate: sshd -t -f %s
      loop:
        - { key: PasswordAuthentication, value: "no" }
        - { key: PermitRootLogin, value: "no" }
        - { key: KbdInteractiveAuthentication, value: "no" }
      notify: restart ssh

    - name: Firewall (solo SSH, HTTP y HTTPS)
      community.general.ufw: { rule: allow, port: "{{ item.port }}", proto: "{{ item.proto }}" }
      loop:
        - { port: "22", proto: tcp }
        - { port: "80", proto: tcp }
        - { port: "443", proto: tcp }
        - { port: "443", proto: udp }

    - name: Firewall activo, todo lo demás bloqueado
      community.general.ufw: { state: enabled, policy: deny, direction: incoming }

    - name: fail2ban activo
      ansible.builtin.service: { name: fail2ban, state: started, enabled: true }

    - name: Directorio de llaves de apt
      ansible.builtin.file: { path: /etc/apt/keyrings, state: directory, mode: "0755" }

    - name: Llave del repositorio oficial de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Repositorio oficial de Docker
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker

    - name: Docker Engine y Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        update_cache: true

    - name: El usuario de despliegue usa Docker
      ansible.builtin.user: { name: "{{ deploy_user }}", groups: [docker], append: true }

    - name: Directorio de la aplicación
      ansible.builtin.file: { path: "{{ app_dir }}/{{ item }}", state: directory, owner: "{{ deploy_user }}", mode: "0750" }
      loop: [".", caddy, backup]

    - name: Archivos de la pila
      ansible.builtin.copy:
        src: "../{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: "{{ deploy_user }}"
        mode: "0640"
      loop: [docker-compose.prod.yml, caddy/Caddyfile, backup/backup.sh, backup/restore.sh]

    - name: Variables de entorno (secretos; nunca en git)
      ansible.builtin.copy: { src: "{{ env_file }}", dest: "{{ app_dir }}/.env.production", owner: "{{ deploy_user }}", mode: "0600" }

    - name: Login en GHCR (imágenes privadas)
      ansible.builtin.shell: "echo '{{ ghcr_token }}' | docker login ghcr.io -u '{{ ghcr_user }}' --password-stdin"
      become_user: "{{ deploy_user }}"
      when: ghcr_token | length > 0
      no_log: true
      changed_when: false

    - name: Desplegar
      ansible.builtin.command:
        cmd: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --pull always --no-build --remove-orphans
        chdir: "{{ app_dir }}"
      become_user: "{{ deploy_user }}"
      changed_when: true
